[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinela-risk-lab"
version = "1.0.0"
description = "Deterministic, offline risk analytics for betting operations from CSV files (no AI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "cryptography>=42",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60"]

[project.scripts]
sentinela = "sentinela.cli:main"

[tool.setuptools]
packages = ["sentinela", "sentinela.config", "sentinela.templates"]

[tool.setuptools.package-data]
"sentinela.config" = ["*.yaml"]
"sentinela.templates" = ["*.j2"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
